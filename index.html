<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>WaterRush 2.0</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:white;touch-action:none;user-select:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);touch-action:none}button{font:700 16px system-ui;border:0;border-radius:12px;background:#1678bd;color:white;padding:14px 25px}#menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#fffffff5;font:15px system-ui;color:#222}#menu[hidden]{display:none}#menu p{margin:0;max-width:290px;line-height:1.6}#menu h1{margin:0}</style><canvas aria-label="WaterRush"></canvas><div id="menu"><h1 id="heading">WATER RUSH</h1><p id="info">Arrastra para moverte y disparar. Desliza arriba para saltar y abajo para agacharte. Sobrevive tres oleadas de un minuto.</p><button id="start">Jugar sin AR</button><p>Modo AR próximamente</p></div><script>
'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),img=new Image();img.src='player.webp';const W=360,H=640,F=490, platforms=[{x:65,y:450,w:58,h:40},{x:235,y:414,w:72,h:10}], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let x,y,vy,dir,hp,kills,coins,level,t,total,spawn,shot,inv,ground,crouch,held,target,pid=null,ax,ay,bullets,enemies,particles,state='ready',last=0,ac,best=0,notice=0,transition=0;try{best=+localStorage.waterBest||0}catch{}const menu=document.querySelector('#menu'),heading=document.querySelector('#heading'),info=document.querySelector('#info'),start=document.querySelector('#start');function reset(){x=180;y=F;vy=0;dir=1;hp=3;kills=coins=t=total=spawn=shot=inv=notice=transition=0;level=1;ground=true;crouch=held=false;target=x;pid=null;bullets=[];enemies=[];particles=[]}reset();function tier(){return coins>=65?3:coins>=25?2:1}function sound(f,d=.06){if(!ac)return;try{let o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,ac.currentTime+d);a.gain.setValueAtTime(.025,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}start.onclick=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}reset();state='play';menu.hidden=true};function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}c.onpointerdown=e=>{if(state!=='play'||pid!==null)return;pid=e.pointerId;c.setPointerCapture(pid);[ax,ay]=pos(e);held=true;target=x};c.onpointermove=e=>{if(e.pointerId!==pid)return;let [px,py]=pos(e),dx=px-ax,dy=py-ay;if(Math.abs(dy)>24&&Math.abs(dy)>Math.abs(dx)*1.2){if(dy<0){crouch=false;if(ground){vy=-390;ground=false;sound(300)}}else crouch=true;ay=py;ax=px}else if(Math.abs(dx)>3){dir=Math.sign(dx);target=clamp(target+dx*1.45,22,338);ax=px;ay=py}};function release(e){if(e&&e.pointerId!==pid)return;pid=null;held=crouch=false;target=x}c.onpointerup=c.onpointercancel=c.onlostpointercapture=release;window.addEventListener('blur',()=>release());function finish(win){state=win?'win':'over';release();best=Math.max(best,kills);try{localStorage.waterBest=best}catch{}heading.textContent=win?'¡VICTORIA!':'FIN DE PARTIDA';info.textContent=`Nivel ${level}/3 · ${kills} eliminados · ${Math.floor(total)} s · Récord ${best}`;start.textContent='Volver a jugar sin AR';menu.hidden=false}function burst(x,y,color){for(let i=0;i<5&&particles.length<100;i++)particles.push({x,y,vx:(Math.random()-.5)*110,vy:-Math.random()*90,life:.35,color})}function addEnemy(){let phase=Math.min(2,Math.floor(t/20)),r=Math.random(),type=1;if(level===1){if(phase>0&&r<.18+phase*.08)type=2}else if(level===2){if(phase===2&&r<.18)type=3;else if(r<.55)type=2}else{type=r<.25+phase*.08?3:r<.72?2:1}let s=[0,24,39,57][type],h=[0,1,4,8][type];enemies.push({x:Math.random()<.5?-s:W+s,s,type,h,max:h,v:(48+level*8+phase*8+Math.random()*16)*(type===3?.72:type===2?.86:1)})}function update(dt){if(transition>0){transition-=dt;return}t+=dt;total+=dt;if(t>=60){if(level===3){finish(true);return}level++;t=0;spawn=.4;enemies=[];bullets=[];transition=1.5;return}inv=Math.max(0,inv-dt);notice=Math.max(0,notice-dt);let oldY=y,oldX=x; if(held){let d=target-x;x+=Math.sign(d)*Math.min(Math.abs(d),(crouch?105:235)*dt)}// solid low box; raised platform is one-way
let box=platforms[0];if(y>box.y+1&&x+12>box.x&&x-12<box.x+box.w){if(oldX<=box.x-12)x=box.x-12;else if(oldX>=box.x+box.w+12)x=box.x+box.w+12}vy+=850*dt;y+=vy*dt;ground=false;for(let p of platforms){if(vy>=0&&oldY<=p.y+.5&&y>=p.y&&x+10>p.x&&x-10<p.x+p.w){y=p.y;vy=0;ground=true}}if(y>=F){y=F;vy=0;ground=true}shot-=dt;if(held&&shot<=0){let k=tier();shot=[0,.19,.17,.15][k];let sy=y-(crouch?15:53),sx=x+dir*29;let nearest=null;for(let e of enemies){let d=(e.x-x)*dir;if(d>0&&d<200&&(!nearest||d<nearest.d))nearest={e,d}}// modest automatic vertical aim so small targets are reachable
let slope=nearest?clamp((F-nearest.e.s*.55-sy)/Math.max(30,nearest.d-29),-.65,.85):0;bullets.push({x:sx,y:sy,vx:dir*390,vy:slope*390,r:[0,4,8,13][k],damage:[0,1,2,4][k]});sound(520+k*90)}spawn-=dt;if(spawn<=0){let phase=Math.min(2,Math.floor(t/20));spawn=Math.max(.27,1.04-(level-1)*.19-phase*.17);if(enemies.length<55)addEnemy()}for(let b of bullets){let ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;for(let e of enemies){if(e.dead||b.dead)continue;let left=e.x-e.s/2-b.r,right=e.x+e.s/2+b.r,top=F-e.s-b.r,bottom=F+b.r; // swept segment versus expanded hitbox
let lo=0,hi=1;for(let [a,d,min,max] of [[ox,b.x-ox,left,right],[oy,b.y-oy,top,bottom]]){if(Math.abs(d)<1e-8){if(a<min||a>max)lo=2}else{let u=(min-a)/d,v=(max-a)/d;lo=Math.max(lo,Math.min(u,v));hi=Math.min(hi,Math.max(u,v))}}if(lo<=hi){b.dead=true;e.h-=b.damage;burst(b.x,b.y,'#36aaff');if(e.h<=0){e.dead=true;let old=tier();kills++;coins++;if(tier()>old){notice=2;sound(1200,.25)}else sound(850);}}}}for(let e of enemies){if(e.dead)continue;e.x+=Math.sign(x-e.x)*e.v*dt;let ph=crouch?42:88;if(Math.abs(e.x-x)<e.s/2+12&&y>F-e.s&&y-ph<F&&!inv){hp--;inv=1.2;e.dead=true;burst(x,y-25,'#e44');sound(120,.2);if(hp<=0){finish(false);return}}}bullets=bullets.filter(b=>!b.dead&&b.x>-25&&b.x<W+25&&b.y<F+20&&b.y>90);enemies=enemies.filter(e=>!e.dead);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}function text(s,x,y,size=16,color='#222',align='center'){g.fillStyle=color;g.font=`bold ${size}px system-ui`;g.textAlign=align;g.fillText(s,x,y)}function draw(){g.clearRect(0,0,W,H);text('WATER RUSH',16,30,18,'#222','left');text('♥'.repeat(hp)+'♡'.repeat(3-hp),344,30,23,'#df5347','right');text('NIVEL '+level+'/3',16,57,13,'#555','left');text('00:'+String(Math.max(0,Math.ceil(60-t))).padStart(2,'0'),180,67,26);text('● '+coins,344,57,16,'#b88912','right');g.fillStyle='#ddd';g.fillRect(16,80,328,5);g.fillStyle='#258bdf';g.fillRect(16,80,328*(1-t/60),5);text('ELIMINADOS '+kills,16,105,12,'#555','left');text('POTENCIA '+tier()+'/3',344,105,12,'#1678bd','right');g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(0,F);g.lineTo(W,F);g.stroke();for(let p of platforms){g.fillStyle='#ddd';g.fillRect(p.x,p.y,p.w,p.h);g.strokeRect(p.x,p.y,p.w,p.h)}for(let e of enemies){g.fillStyle=['','#777','#444','#161616'][e.type];g.fillRect(e.x-e.s/2,F-e.s,e.s,e.s);g.fillStyle='white';g.fillRect(e.x-7,F-e.s+7,5,5);g.fillRect(e.x+2,F-e.s+7,5,5);if(e.type>1){g.fillStyle='#ddd';g.fillRect(e.x-e.s/2,F-e.s-6,e.s,3);g.fillStyle='#e65';g.fillRect(e.x-e.s/2,F-e.s-6,e.s*e.h/e.max,3)}}for(let b of bullets){g.fillStyle='#258bdf';g.beginPath();g.ellipse(b.x,b.y,b.r*1.5,b.r*.65,0,0,Math.PI*2);g.fill()}for(let p of particles){g.globalAlpha=p.life/.35;g.fillStyle=p.color;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;g.save();g.translate(x,y);g.scale(dir,1);if(inv&&Math.floor(inv*12)%2)g.globalAlpha=.35;if(img.complete&&img.naturalWidth){let h=crouch?66:112,w=112*img.width/img.height,bob=held&&Math.abs(target-x)>3&&ground?Math.sin(total*25)*2:0;g.drawImage(img,-w*.43-(held&&shot>.12?2:0),-h+bob,w,h)}g.restore();if(notice>0)text('¡POTENCIA MEJORADA!',180,150,19,'#1678bd');if(transition>0)text('NIVEL '+level,180,230,32);text('Arrastra · Mantén · ↑ Salta · ↓ Agáchate',180,550,12,'#777');text(tier()<3?'Próxima mejora: '+(tier()===1?25:65)+' monedas':'POTENCIA MÁXIMA',180,580,13,'#1678bd');text('RÉCORD '+best,180,608,11,'#777')}function frame(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;let r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}g.setTransform(c.width/W,0,0,c.height/H,0,0);if(state==='play'&&!document.hidden)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
