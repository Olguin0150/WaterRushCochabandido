<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Water Rush</title><style>*{box-sizing:border-box}html,body{margin:0;background:#eee;height:100%;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;max-width:540px;margin:auto;touch-action:none}</style><canvas aria-label="Juego de supervivencia con pistola de agua"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),img=new Image();img.src='player.webp';const W=360,H=640,F=490;let x,dir,hp,score,t,spawn,shot,inv, enemies,bullets,state='ready',held=false,anchor=0,target=0,last=0,best=0,ac;try{best=+localStorage.waterBest||0}catch{}function reset(){x=180;dir=1;hp=3;score=t=spawn=shot=inv=0;enemies=[];bullets=[];held=false;target=x}reset();function sound(f,d){if(!ac)return;let o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,ac.currentTime+d);a.gain.setValueAtTime(.035,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function pos(e){return (e.clientX-c.getBoundingClientRect().left)*W/c.clientWidth}let pid=null;c.onpointerdown=e=>{if(pid!==null)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}if(state!=='play'){reset();state='play'}pid=e.pointerId;c.setPointerCapture(pid);held=true;anchor=pos(e);target=x;};c.onpointermove=e=>{if(e.pointerId!==pid)return;let p=pos(e),d=p-anchor;if(Math.abs(d)>2){dir=Math.sign(d);target=Math.max(24,Math.min(336,target+d*1.5));anchor=p}};function release(e){if(e.pointerId!==pid)return;held=false;pid=null;target=x}c.onpointerup=c.onpointercancel=c.onlostpointercapture=release;window.onblur=()=>{held=false;pid=null;target=x};function update(dt){t+=dt;inv=Math.max(0,inv-dt);if(held){let d=target-x;x+=Math.sign(d)*Math.min(Math.abs(d),240*dt);shot-=dt;if(shot<=0){shot=.18;bullets.push({x:x+dir*32,y:F-53,v:dir*330});sound(520,.06)}}spawn-=dt;if(spawn<=0){spawn=Math.max(.35,1.45-t*.012);let side=Math.random()<.5;enemies.push({x:side?-18:378,s:30+Math.random()*22,v:35+Math.random()*25+Math.min(85,t*.65)})}for(let b of bullets)b.x+=b.v*dt;for(let e of enemies){e.x+=Math.sign(x-e.x)*e.v*dt;for(let b of bullets){if(!b.dead&&!e.dead&&Math.abs(b.x-e.x)<e.s/2+5&&b.y>F-e.s-12){b.dead=e.dead=true;score++;sound(850,.08)}}if(!e.dead&&Math.abs(e.x-x)<e.s/2+15){e.dead=true;if(!inv){hp--;inv=1;sound(120,.2)}}}bullets=bullets.filter(b=>!b.dead&&b.x>-20&&b.x<380);enemies=enemies.filter(e=>!e.dead);if(hp<=0){state='over';held=false;best=Math.max(best,score);try{localStorage.waterBest=best}catch{}}}function text(s,x,y,size=16,color='#222',align='center'){g.fillStyle=color;g.font=`bold ${size}px system-ui`;g.textAlign=align;g.fillText(s,x,y)}function draw(){g.fillStyle='#fafafa';g.fillRect(0,0,W,H);g.fillStyle='#f0f0f0';g.fillRect(0,F,W,H-F);g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(0,F);g.lineTo(W,F);g.stroke();text('WATER RUSH',18,35,19,'#222','left');text('♥'.repeat(hp),342,35,22,'#df5347','right');text('ELIMINADOS',18,67,10,'#777','left');text(score,18,92,25,'#222','left');text('TIEMPO',342,67,10,'#777','right');text(Math.floor(t)+' s',342,92,25,'#222','right');for(let e of enemies){g.fillStyle='#333';g.fillRect(e.x-e.s/2,F-e.s,e.s,e.s);g.fillStyle='#fff';g.fillRect(e.x-8,F-e.s+9,5,5);g.fillRect(e.x+3,F-e.s+9,5,5)}for(let b of bullets){g.fillStyle='#258bdf';g.beginPath();g.ellipse(b.x,b.y,8,3,0,0,7);g.fill()}g.save();g.translate(x,F);g.scale(dir,1);if(inv&&Math.floor(inv*12)%2)g.globalAlpha=.35;if(img.complete&&img.naturalWidth){let h=112,w=h*img.width/img.height;g.drawImage(img,-w*.43,-h+(held&&Math.abs(target-x)>3?Math.sin(t*22)*2:0),w,h)}g.restore();if(state==='play'){text('Arrastra y mantén para disparar',180,565,13,'#777');text('RÉCORD  '+best,180,594,12,'#777')}else{g.fillStyle='#ffffffed';g.fillRect(15,145,330,240);text(state==='ready'?'SUPERVIVENCIA':'FIN DE PARTIDA',180,190,25);if(state==='ready'){text('Arrastra para moverte',180,230);text('Mantén pulsado para disparar',180,257);text('Esquiva y elimina los bloques',180,284)}else{text('Eliminados: '+score,180,230,20);text('Tiempo: '+Math.floor(t)+' s',180,260);text('Récord: '+best,180,290)}text(state==='ready'?'TOCA PARA EMPEZAR':'TOCA PARA REINTENTAR',180,345,14,'#1678bd')}}function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;let r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}g.setTransform(c.width/W,0,0,c.height/H,0,0);if(state==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
